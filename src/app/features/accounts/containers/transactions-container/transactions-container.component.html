<div class="transactions-page">
  <h1>Transaction History</h1>

  <!-- Filters -->
  <div class="filters-card">
    <div class="filters-row">
      <div class="filter-group">
        <label>Type</label>
        <select [(ngModel)]="filterType" class="filter-input">
          <option value="">All Types</option>
          <option value="Credit">Credit</option>
          <option value="Debit">Debit</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Min Amount</label>
        <input type="number" [(ngModel)]="minAmount" placeholder="0" class="filter-input" />
      </div>
      <div class="filter-group">
        <label>Max Amount</label>
        <input type="number" [(ngModel)]="maxAmount" placeholder="99999" class="filter-input" />
      </div>
      <div class="filter-group">
        <label>Start Date</label>
        <input type="date" [(ngModel)]="startDate" class="filter-input" />
      </div>
      <div class="filter-group">
        <label>End Date</label>
        <input type="date" [(ngModel)]="endDate" class="filter-input" />
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn-primary" (click)="applyFilters()">Apply Filters</button>
      <button class="btn-outline" (click)="clearFilters()">Clear</button>
    </div>
  </div>

  @if (loading) {
    <app-loader></app-loader>
  }

  @if (error && !loading) {
    <app-error-message [message]="error"></app-error-message>
  }

  @if (!loading && !error) {
    @if (transactions.length === 0) {
      <p style="color:#666; margin-top:16px; text-align:center;">
        No transactions found for Account ID: {{ accountId }}
      </p>
    } @else {
      <app-table
        [headers]="headers"
        [data]="transactions"
        [columns]="columns">
      </app-table>

      <div class="pagination-row">
        <button class="btn-outline" (click)="prevPage()" [disabled]="page <= 1">← Prev</button>
        <span class="pagination-text">Page <b>{{ page }}</b></span>
        <button class="btn-outline" (click)="nextPage()" [disabled]="transactions.length < limit">Next →</button>
      </div>
    }
  }
</div>
